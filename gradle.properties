# Gradle daemon / build tuning. Committed and CI-safe: no proxy, no signing,
# no machine-local SDK paths belong in this file.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only; no legacy support library in this project.
android.useAndroidX=true

# Each module gets its own R class, which keeps release builds smaller and faster.
android.nonTransitiveRClass=true

kotlin.code.style=official
